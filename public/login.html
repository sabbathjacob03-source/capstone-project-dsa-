<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/index.html">Event Ticketing</a>
      <a class="back-link" href="/index.html">Browse events</a>
    </header>
    <main class="page-shell auth-page">
      <section class="auth-card">
        <h1 id="auth-title">Log in</h1>
        <div class="auth-tabs">
          <button id="login-tab" type="button" class="active">Log in</button>
          <button id="signup-tab" type="button">Sign up</button>
        </div>
        <form id="auth-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
          </div>
          <div id="role-field" class="field" hidden>
            <label for="role">Role</label>
            <select id="role" name="role">
              <option value="attendee">Attendee</option>
              <option value="organizer">Organizer</option>
              <option value="staff">Staff</option>
            </select>
          </div>
          <p id="auth-error" class="error" role="alert" hidden></p>
          <button id="auth-submit" class="primary-button" type="submit">Log in</button>
        </form>
      </section>
    </main>
    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
